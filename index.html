<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đại Dương Tri Thức - Khám phá và chinh phục</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Nunito', sans-serif;
    color: #3b175c;
    background: linear-gradient(180deg, #ffcde5 0%, #f0abfc 25%, #d8b4fe 50%, #c084fc 75%, #7e22ce 100%);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
}

h1, h2, h3, .brand-font { font-family: 'Fredoka', sans-serif; }

/* Bối cảnh biển hoàng hôn hồng - tím lấp lánh */
.ocean-backdrop {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.sun-ray {
    position: absolute;
    top: -20%;
    width: 160px;
    height: 140%;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0%, rgba(253, 186, 226, 0.2) 60%, transparent 100%);
    transform: rotate(20deg);
    animation: raySway 8s ease-in-out infinite alternate;
}

@keyframes raySway {
    0% { transform: rotate(15deg) translateX(-20px); opacity: 0.6; }
    100% { transform: rotate(25deg) translateX(25px); opacity: 0.9; }
}

.bg-bubble {
    position: absolute;
    bottom: -50px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(244,114,182,0.3) 65%, rgba(168,85,247,0.4));
    border: 2px solid rgba(255,255,255,0.8);
    animation: riseUp linear infinite;
}

@keyframes riseUp {
    0% { transform: translateY(0) scale(0.8); opacity: 0; }
    20% { opacity: 0.9; }
    80% { opacity: 0.8; }
    100% { transform: translateY(-110vh) scale(1.15); opacity: 0; }
}

.jellyfish-float {
    position: absolute;
    font-size: 40px;
    filter: drop-shadow(0 0 15px rgba(255, 192, 230, 0.9));
    animation: jellyDrift 7s ease-in-out infinite;
}

@keyframes jellyDrift {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-30px) rotate(8deg); }
}

/* Chữ bong bóng 3D cực nổi và bắt mắt cho tên trang web */
.bubble-logo-text {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 0.5px;
    background: linear-gradient(180deg, #ffffff 0%, #ffe4e6 30%, #f472b6 65%, #9333ea 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 2px #ffffff;
    filter:
        drop-shadow(0 2px 0 #be185d)
        drop-shadow(0 4px 0 #6b21a8)
        drop-shadow(0 6px 12px rgba(147, 51, 234, 0.45));
    position: relative;
    display: inline-block;
    line-height: 1.1;
}

.glass {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(20px);
    border: 2.5px solid rgba(255, 255, 255, 1);
    box-shadow: 0 15px 35px rgba(107, 33, 168, 0.2);
}

.ocean-button {
    background: linear-gradient(135deg, #fb7185, #ec4899 50%, #9333ea);
    color: white;
    border-radius: 18px;
    box-shadow: 0 6px 0 #701a75, 0 12px 25px rgba(236, 72, 153, 0.35);
    transition: .2s;
}

.ocean-button:hover {
    transform: translateY(-3px);
    box-shadow: 0
