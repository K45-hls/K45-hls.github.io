<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Trò Chơi Học Tập Tương Tác</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
        }
        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.3);
        }
        header h1 { margin: 0; font-size: 2.2rem; font-weight: 800; }
        header p { margin: 8px 0 0 0; font-size: 1.1rem; font-weight: 600; }
        .container { max-width: 1100px; margin: -20px auto 40px auto; padding: 0 20px; }
        .category-bar {
            display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; flex-wrap: wrap;
        }
        .cat-btn {
            background: white; color: var(--text-main); border: 2px solid #e2e8f0;
            padding: 10px 20px; border-radius: 50px; font-weight: 700; cursor: pointer;
        }
        .cat-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .games-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 25px;
        }
        @media (max-width: 600px) { .games-grid { grid-template-columns: 1fr; } }
        .game-card {
            background: var(--card-bg); border-radius: 20px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); border: 1px solid #f1f5f9;
        }
        .game-header {
            padding: 16px 20px; background: #fafafa; border-bottom: 1px solid #f1f5f9;
            display: flex; justify-content: space-between; align-items: center;
        }
        .game-title { font-size: 1.15rem; font-weight: 700; color: #0f172a; margin: 0; }
        .tag { background: #e0e7ff; color: #4338ca; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
        .game-frame-wrapper { position: relative; width: 100%; height: 480px; background-color: #f1f5f9; }
        .game-frame-wrapper iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <header>
        <h1>🎮 KHO TRÒ CHƠI HỌC TẬP TƯƠNG TÁC</h1>
        <p>Tổng hợp trò chơi ôn tập vui nhộn cho học sinh</p>
    </header>
    <div class="container">
        <div class="category-bar">
            <button class="cat-btn active">Tất cả</button>
            <button class="cat-btn">📘 Tiếng Việt</button>
            <button class="cat-btn">📐 Toán học</button>
        </div>
        <div class="games-grid">
            <div class="game-card">
                <div class="game-header">
                    <h3 class="game-title">🎯 Vòng Quay Từ Vựng</h3>
                    <span class="tag">Tiếng Việt</span>
                </div>
                <div class="game-frame-wrapper">
                    <iframe src="https://wordwall.net/embed/40edb260907449c28a5e8486016a2ef7?themeId=1&templateId=5&fontStackId=0" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
