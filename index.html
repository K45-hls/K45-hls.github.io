<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Bài Tập & Trò Chơi Học Tập</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
        }
        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.3);
        }
        header h1 { margin: 0; font-size: 2.2rem; font-weight: 800; }
        header p { margin: 8px 0 0 0; font-size: 1.1rem; font-weight: 600; }
        .container { max-width: 1100px; margin: -20px auto 40px auto; padding: 0 20px; }
        
        .section-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #334155;
            margin: 30px 0 15px 0;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #f1f5f9;
        }

        .card-header {
            padding: 16px 20px;
            background: #fafafa;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title { font-size: 1.1rem; font-weight: 700; color: #0f172a; margin: 0; }
        .tag { background: #e0e7ff; color: #4338ca; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }

        .sheet-img-wrapper {
            width: 100%;
            height: 380px;
            overflow: hidden;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .sheet-img-wrapper img {
            width: 100%;
            height: auto;
            object-fit: cover;
        }
        .card-body {
            padding: 15px 20px;
            text-align: center;
        }
        .btn-download {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
        }
        .btn-download:hover { background: #059669; }
    </style>
</head>
<body>
    <header>
        <h1>📚 KHO BÀI TẬP & TRÒ CHƠI HỌC TẬP</h1>
        <p>Góc học tập tương tác dành cho học sinh</p>
    </header>

    <div class="container">
        <div class="section-title">📝 Phiếu Bài Tập Ôn Tập</div>
        <div class="grid-layout">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">📌 Ôn tập Luyện từ và câu: Tính từ</h3>
                    <span class="tag">Tiếng Việt 4</span>
                </div>
                <div class="sheet-img-wrapper">
                    <img src="image.png" alt="Bài tập Tính từ">
                </div>
                <div class="card-body">
                    <a href="image.png" target="_blank" class="btn-download">🔍 Xem full & Tải về in</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
